<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Projetos COR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Outfit é só o substituto geométrico da Cera Pro quando ela não está instalada -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root {
      /* Manual de Marca Prefeitura Rio 2025 */
      --azul-escuro: #13335a;
      --azul-medio: #2a688f;
      --azul-claro: #42b9eb;
      --cinza-marca: #eceded;
      --branco: #ffffff;

      --texto: var(--azul-escuro);
      --texto-suave: #4f6680;
      --fio: #d3dae2;

      /* módulo do grid da marca (1/12 da menor dimensão), limitado para telas grandes */
      --m: clamp(16px, 2.6vw, 32px);
      --largura: 1200px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--branco);
      color: var(--texto);
      font-family: "Cera Pro", "Outfit", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .conteiner {
      max-width: var(--largura);
      margin: 0 auto;
      padding: 0 var(--m);
    }

    /* Triângulo do canto superior direito, presente em todas as peças do manual */
    .canto {
      position: absolute;
      top: var(--m);
      right: var(--m);
      width: calc(var(--m) * 2.2);
      aspect-ratio: 1;
      background: var(--azul-claro);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      z-index: 2;
    }

    /* Triângulo usado como ponto-final: metade da altura da fonte */
    .ponto {
      display: inline-block;
      width: .5em;
      height: .5em;
      margin-left: .08em;
      background: var(--azul-claro);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .marca {
      display: block;
      color: inherit;
    }
    .marca svg { display: block; height: 100%; width: auto; }

    /* ---------- Topo ---------- */
    .topo {
      position: relative;
      overflow: hidden;
      background: var(--azul-escuro);
      color: var(--branco);
    }

    .topo-padrao {
      position: absolute;
      inset: 0 0 0 auto;
      width: 42%;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 30%);
      mask-image: linear-gradient(to right, transparent, #000 30%);
    }
    .topo-padrao svg { width: 100%; height: 100%; display: block; }

    .topo .conteiner {
      position: relative;
      z-index: 1;
      padding-top: var(--m);
      padding-bottom: calc(var(--m) * 1.4);
    }

    .topo .marca { height: calc(var(--m) * 2.2); }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: calc(var(--m) * .6) calc(var(--m) * 2);
      margin-top: calc(var(--m) * 1.4);
      max-width: 700px;
    }


    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 900;
      line-height: .92;
      letter-spacing: -.03em;
    }


    .numeros {
      display: flex;
      gap: calc(var(--m) * 1.4);
      margin: 0 0 .3em;
      padding: 0;
      list-style: none;
    }
    .numeros strong {
      display: block;
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1;
    }
    .numeros span {
      font-size: .74rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #c9d6e4;
    }

    /* ---------- Barra de filtros ---------- */
    .ferramentas {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px var(--m);
      padding: var(--m) 0 calc(var(--m) * .7);
      border-bottom: 1px solid var(--fio);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 2px;
    }
    .filtro {
      border: none;
      background: none;
      padding: 6px 8px;
      color: var(--texto);
      font: inherit;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .filtro sup {
      font-size: .66rem;
      font-weight: 700;
      color: var(--azul-medio);
      margin-left: 2px;
    }
    .filtro:hover { color: var(--azul-medio); }
    /* destaque em caixa azul-clara, como o "MAPA DE RISCO" do manual */
    .filtro.ativo { background: var(--azul-claro); color: var(--azul-escuro); }
    .filtro.ativo sup { color: var(--azul-escuro); }
    .filtro:focus-visible { outline: 2px solid var(--azul-escuro); outline-offset: 2px; }

    .busca {
      position: relative;
      flex: 1 0 180px;
      max-width: 260px;
    }
    .busca i {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--azul-medio);
    }
    .busca input {
      width: 100%;
      padding: 8px 0 8px 26px;
      border: none;
      border-bottom: 2px solid var(--azul-escuro);
      border-radius: 0;
      background: transparent;
      color: var(--texto);
      font: inherit;
      font-size: .95rem;
    }
    .busca input::placeholder { color: var(--texto-suave); }
    .busca input:focus { outline: none; border-bottom-color: var(--azul-claro); }

    /* ---------- Cards ---------- */
    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: var(--m);
      padding: var(--m) 0 calc(var(--m) * 3);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--fio);
      background: var(--branco);
      color: inherit;
      text-decoration: none;
      transition: border-color .2s, transform .2s;
    }
    .card:hover, .card:focus-visible {
      border-color: var(--azul-escuro);
      transform: translateY(-3px);
      outline: none;
    }

    .capa {
      position: relative;
      aspect-ratio: 2 / 1;
      overflow: hidden;
      background: var(--azul-escuro);
      background-size: cover;
      background-position: center;
    }
    .capa:not(.foto) {
      display: grid;
      place-items: center;
      /* degradê digital do manual */
      background-image: linear-gradient(135deg, var(--azul-escuro) 0%, var(--azul-medio) 55%, var(--azul-claro) 100%);
    }
    .capa .icone {
      font-size: 4.2rem;
      line-height: 1;
      color: var(--branco);
      transition: transform .3s;
    }
    .card:hover .capa .icone { transform: scale(1.08); }

    .capa.foto {
      background-position: top center;
      border-bottom: 1px solid var(--fio);
    }
    /* filtro azul leve, que sai no hover para mostrar a tela como ela é */
    .capa.foto::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--azul-escuro);
      mix-blend-mode: multiply;
      opacity: .18;
      transition: opacity .25s;
    }
    .card:hover .capa.foto::after { opacity: 0; }

    .card .canto {
      top: 0;
      right: 0;
      width: 0;
      transition: width .25s;
    }
    .card:hover .canto, .card:focus-visible .canto { width: 44px; }

    .corpo {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 18px 16px;
    }

    .categoria {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--texto-suave);
      margin-bottom: 10px;
    }
    .categoria::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--cor-categoria);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .corpo h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .corpo p {
      margin: 0 0 14px;
      color: var(--texto-suave);
      font-size: .92rem;
      line-height: 1.55;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-bottom: 16px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--azul-medio);
    }

    .acessar {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--fio);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .acessar::after {
      content: "";
      width: 10px;
      height: 14px;
      background: var(--azul-claro);
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      transition: transform .2s;
    }
    .card:hover .acessar::after { transform: translateX(4px); }

    .vazio {
      grid-column: 1 / -1;
      padding: calc(var(--m) * 2) 0;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
    }
    .vazio small {
      display: block;
      margin-top: 6px;
      font-size: .95rem;
      font-weight: 400;
      text-transform: none;
      color: var(--texto-suave);
    }

    /* ---------- Rodapé: marca, fio e numeração, como as páginas do manual ---------- */
    .rodape .conteiner {
      display: flex;
      align-items: flex-end;
      gap: var(--m);
      padding-bottom: calc(var(--m) * 1.4);
    }
    .rodape .marca { height: 48px; flex: none; }
    .rodape .fio { flex: 1; height: 1px; background: var(--azul-escuro); margin-bottom: 6px; }
    .rodape .pagina { font-size: 1.1rem; font-weight: 500; line-height: 1; }

    /* ---------- Visor: sistema aberto dentro do painel ---------- */
    .visor {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      background: var(--branco);
    }
    .visor[hidden] { display: none; }
    body.visor-aberto { overflow: hidden; }

    .visor-barra {
      display: flex;
      align-items: center;
      gap: var(--m);
      min-height: 56px;
      padding: 8px var(--m);
      background: var(--azul-escuro);
      color: var(--branco);
    }
    .visor-barra button, .visor-barra a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: none;
      padding: 6px 0;
      color: inherit;
      font: inherit;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .visor-barra button:hover, .visor-barra a:hover { color: var(--azul-claro); }
    .visor-barra button:focus-visible, .visor-barra a:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 4px; }
    .voltar::before {
      content: "";
      width: 10px;
      height: 14px;
      background: var(--azul-claro);
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }
    .visor-titulo {
      flex: 1;
      min-width: 0;
      padding-left: var(--m);
      border-left: 1px solid rgba(255, 255, 255, .25);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .visor-titulo strong { font-weight: 900; text-transform: uppercase; }
    .visor-titulo span { margin-left: 10px; font-size: .78rem; color: #c9d6e4; }
    .visor iframe { flex: 1; width: 100%; border: 0; background: var(--branco); }

    /* abaixo disso o padrão não cabe ao lado do texto: vira fundo rebaixado */
    @media (max-width: 1100px) {
      .topo-padrao { width: 100%; opacity: .22; -webkit-mask-image: none; mask-image: none; }
    }

    @media (max-width: 720px) {
      .hero { margin-top: calc(var(--m) * 1.4); }
      .ferramentas { flex-direction: column-reverse; align-items: stretch; }
      .busca { flex-basis: auto; max-width: none; }
      .numeros { gap: var(--m); }
      .numeros strong { font-size: 2rem; }
      .visor-titulo span, .nova-aba span { display: none; }
    }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-padrao" id="topo-padrao" aria-hidden="true"></div>
    <span class="canto" aria-hidden="true"></span>
    <div class="conteiner">
      <a class="marca" href="https://cor.rio" target="_blank" rel="noopener" aria-label="COR - Centro de Operações e Resiliência">
        <svg viewBox="0 0 414.35 106.6"><use href="#marca-cor" /></svg>
      </a>

      <div class="hero">
        <h1>Sistemas<span class="ponto"></span></h1>
        <ul class="numeros">
          <li><strong id="total-projetos">0</strong><span>Sistemas</span></li>
          <li><strong id="total-categorias">0</strong><span>Frentes</span></li>
          <li><strong>24h</strong><span>Operação</span></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="conteiner">
    <div class="ferramentas">
      <nav class="filtros" id="filtros" aria-label="Filtrar por categoria"></nav>
      <label class="busca">
        <i class="bi bi-search"></i>
        <input id="busca" type="search" placeholder="Buscar projeto ou tecnologia" aria-label="Buscar projeto">
      </label>
    </div>

    <section class="grade" id="grade" aria-live="polite"></section>
  </main>

  <section class="visor" id="visor" hidden aria-label="Sistema aberto">
    <div class="visor-barra">
      <a class="voltar" id="voltar" href="https://painel-cor.netlify.app/">Voltar</a>
      <div class="visor-titulo"><strong id="visor-titulo"></strong><span id="visor-categoria"></span></div>
      <a class="nova-aba" id="nova-aba" href="#" target="_blank" rel="noopener"><span>Abrir em nova aba</span><i class="bi bi-box-arrow-up-right"></i></a>
    </div>
  </section>

  <footer class="rodape">
    <div class="conteiner">
      <span class="marca" aria-label="COR - Centro de Operações e Resiliência">
        <svg viewBox="0 0 414.35 106.6"><use href="#marca-cor" /></svg>
      </span>
      <span class="fio"></span>
      <span class="pagina" id="pagina" title="Projetos exibidos">00</span>
    </div>
  </footer>

  <script src="projetos.js"></script>
  <script>
    const filtrosEl = document.getElementById("filtros");
    const gradeEl = document.getElementById("grade");
    const buscaEl = document.getElementById("busca");
    const paginaEl = document.getElementById("pagina");

    let categoriaAtiva = "Todos";

    const escapar = (texto) =>
      String(texto).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const normalizar = (texto) =>
      texto.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    const doisDigitos = (n) => String(n).padStart(2, "0");

    // "Vision AI – Alagamentos" -> "vision-ai-alagamentos"
    const slug = (p) => normalizar(p.titulo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    // "Tempo real" -> "#TempoReal", seguindo a exceção de hashtags do manual
    const hashtag = (tag) =>
      "#" + tag.split(/\s+/).map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join("").replace(/[^\p{L}\p{N}]/gu, "");

    // Gerador pseudoaleatório com semente: cada projeto sempre recebe o mesmo padrão
    function sorteador(texto) {
      let s = 2166136261;
      for (const c of texto) s = Math.imul(s ^ c.codePointAt(0), 16777619);
      return () => {
        s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Padrão de meios-quadrados (triângulos retângulos) das páginas "Padrões" do manual
    function padrao({ colunas, linhas, semente, cores, densidade, fundo, alinhar = "xMidYMid" }) {
      const sorte = sorteador(semente);
      const cantos = [[0, 0], [1, 0], [1, 1], [0, 1]];
      let formas = "";
      for (let y = 0; y < linhas; y++) {
        for (let x = 0; x < colunas; x++) {
          if (sorte() > densidade(x, y)) continue;
          const omitido = Math.floor(sorte() * 4);
          const pontos = cantos.filter((_, i) => i !== omitido).map(([cx, cy]) => `${x + cx},${y + cy}`).join(" ");
          const cor = cores[Math.floor(sorte() * cores.length)];
          formas += `<polygon points="${pontos}" fill="${cor}"/>`;
        }
      }
      const base = fundo ? `<rect width="${colunas}" height="${linhas}" fill="${fundo}"/>` : "";
      return `<svg viewBox="0 0 ${colunas} ${linhas}" preserveAspectRatio="${alinhar} slice" aria-hidden="true">${base}${formas}</svg>`;
    }

    function renderizarTopo() {
      const colunas = 22, linhas = 13;
      document.getElementById("topo-padrao").innerHTML = padrao({
        colunas, linhas,
        semente: "prefeitura-rio-cor",
        alinhar: "xMaxYMin",
        cores: ["#42b9eb", "#42b9eb", "#2a688f", "#ffffff"],
        // mais denso à direita e embaixo, dissolvendo em direção ao texto
        densidade: (x, y) => (x >= colunas - 4 && y < 3 ? 0 : Math.pow(x / colunas, 1.4) * 0.8 + (y / linhas) * 0.25),
      });
      document.getElementById("total-projetos").textContent = doisDigitos(PROJETOS.length);
      document.getElementById("total-categorias").textContent = doisDigitos(Object.keys(CATEGORIAS).length);
    }

    function renderizarFiltros() {
      const nomes = ["Todos", ...Object.keys(CATEGORIAS)];
      filtrosEl.innerHTML = nomes.map((nome) => {
        const total = nome === "Todos" ? PROJETOS.length : PROJETOS.filter((p) => p.categoria === nome).length;
        const ativo = nome === categoriaAtiva;
        return `<button class="filtro${ativo ? " ativo" : ""}" data-categoria="${escapar(nome)}" aria-pressed="${ativo}">${escapar(nome)}<sup>${total}</sup></button>`;
      }).join("");
    }

    function renderizarCards() {
      const termo = normalizar(buscaEl.value.trim());

      const visiveis = PROJETOS.filter((p) => {
        const naCategoria = categoriaAtiva === "Todos" || p.categoria === categoriaAtiva;
        const texto = normalizar([p.titulo, p.descricao, p.categoria, ...p.tags].join(" "));
        return naCategoria && (!termo || texto.includes(termo));
      });

      paginaEl.textContent = doisDigitos(visiveis.length);

      if (!visiveis.length) {
        gradeEl.innerHTML = `<div class="vazio">Nenhum projeto encontrado<span class="ponto"></span><small>Tente outro termo ou volte para "Todos".</small></div>`;
        return;
      }

      gradeEl.innerHTML = visiveis.map((p) => {
        const cores = CATEGORIAS[p.categoria] || { cor1: "#42b9eb", cor2: "#13335a" };
        const capa = p.imagem
          ? `<div class="capa foto" style="background-image: url('${encodeURI(p.imagem)}')"></div>`
          : `<div class="capa"><i class="bi ${escapar(p.icone)} icone" aria-hidden="true"></i></div>`;

        // sistemas que aceitam iframe abrem no visor; os outros, na mesma aba
        const destino = p.incorporar === false ? escapar(p.link) : `#sistema=${slug(p)}`;

        return `
          <a class="card" href="${destino}" style="--cor-categoria: ${escapar(cores.cor1)}">
            ${capa}
            <span class="canto" aria-hidden="true"></span>
            <div class="corpo">
              <span class="categoria">${escapar(p.categoria)}</span>
              <h3>${escapar(p.titulo)}</h3>
              <p>${escapar(p.descricao)}</p>
              <div class="tags">${p.tags.map((t) => `<span>${escapar(hashtag(t))}</span>`).join("")}</div>
              <span class="acessar">Acessar</span>
            </div>
          </a>`;
      }).join("");
    }

    filtrosEl.addEventListener("click", (e) => {
      const botao = e.target.closest(".filtro");
      if (!botao) return;
      categoriaAtiva = botao.dataset.categoria;
      renderizarFiltros();
      renderizarCards();
    });

    buscaEl.addEventListener("input", renderizarCards);

    // ---------- Visor ----------
    const visorEl = document.getElementById("visor");
    let quadroEl = null;
    let sistemaAberto = null;

    function abrirVisor(p) {
      document.getElementById("visor-titulo").textContent = p.titulo;
      document.getElementById("visor-categoria").textContent = p.categoria;
      document.getElementById("nova-aba").href = p.link;
      // um iframe novo, com o src definido antes de entrar na página, não cria entradas no histórico
      if (sistemaAberto !== p) {
        quadroEl?.remove();
        quadroEl = document.createElement("iframe");
        quadroEl.title = p.titulo;
        quadroEl.src = p.link;
        visorEl.append(quadroEl);
        sistemaAberto = p;
      }
      visorEl.hidden = false;
      document.body.classList.add("visor-aberto");
      document.title = `${p.titulo} · Sistemas COR`;
      document.getElementById("voltar").focus();
    }

    function fecharVisor() {
      visorEl.hidden = true;
      quadroEl?.remove();
      quadroEl = null;
      sistemaAberto = null;
      document.body.classList.remove("visor-aberto");
      document.title = tituloOriginal;
    }

    // o endereço #sistema=<slug> permite usar o voltar do navegador e compartilhar o link
    function sincronizarVisor() {
      const atual = new URLSearchParams(location.hash.slice(1)).get("sistema");
      const p = atual && PROJETOS.find((x) => slug(x) === atual && x.incorporar !== false);
      p ? abrirVisor(p) : fecharVisor();
    }

    // "Voltar" é um link para a página inicial, que recarrega o painel. Não usa history.back():
    // as navegações internas do sistema também entram no histórico da aba, e voltar recuaria
    // dentro do iframe, deixando a tela em branco

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !visorEl.hidden) document.getElementById("voltar").click();
    });

    const tituloOriginal = document.title;
    window.addEventListener("hashchange", sincronizarVisor);
    // ao voltar de um sistema aberto na mesma aba, a página pode ser restaurada do cache do navegador
    window.addEventListener("pageshow", (e) => { if (e.persisted) sincronizarVisor(); });

    renderizarTopo();
    renderizarFiltros();
    renderizarCards();
    sincronizarVisor();
  </script>
</body>
</html>
